<!DOCTYPE html>
<html> 
    <head>

        <title>Total 2023 Carbon Dioxide emissions (tonnes) per continent </title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
    <style>
      html { height:100%;}
          
      body {height:100%;padding: 0;
          margin: 0;
      }
          
      #map {
        width: 100%;
            height: 100%;
      }
      
      
      .info {            
      z-index: 1000;            
      position: absolute;            
      right: 20px;            
      top: 20px;            
      padding: 6px 8px;            
      font: 14px Arial, Helvetica, sans-serif;            
      text-align: right;            
      background: white;            
      background: rgba(255, 255, 255, 0.8);            
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);            
      border-radius: 5px;          
      }        

      .info h1 {            
      font-size: 16px;            
      margin: 0 0 5px;            
      color: #777777;          
      }

      .legend {              
      z-index: 1000;              
      position: absolute;              
      right: 20px;              
      bottom: 20px;              
      padding: 6px 8px;              
      font: 14px Arial, Helvetica, sans-serif;              
      background: white;              
      background: rgba(255, 255, 255, 0.8);              
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);              
      border-radius: 5px;          
      }
        
            
      .legend i {              
      width: 17px;              
      height: 16px;              
      float: left;              
      margin-right: 8px;              
      opacity: 0.7;          
      }


    </style>

    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

    </head>

    <body>
<div id='map'></div>
<div class='legend'></div>


    <script>
      //Our JavaScript will go here.
      // 1. create the map object and the base layer.
            
          var map = L.map('map').setView([30.517293, -12.551819], 2); //latlong coordinates centered over US
            
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          

         var grades = [0, 400000000, 1000000000, 2000000000, 5000000000, 10000000000, 23000000000];
         //400000000, 1000000000, 2000000000, 5000000000, 10000000000, 23000000000 //382972000, 430302660, 1108965000, 1418739200, 4993221000, 6123549700, 22600220000
         var colors = chroma.scale('PuRd').colors(grades.length);
         

      function getColor(d) {
  if (d == null) return '#ccc'; // handle missing data

  for (var i = 0; i < grades.length - 1; i++) {
    if (d >= grades[i] && d < grades[i + 1]) {
      return colors[i];
    }
  }

  // For values above the last threshold
  if (d >= grades[grades.length - 1]) {
    return colors[colors.length - 1];
  }

  // For values below the first threshold
  return colors[0];
}

      //determine the style class based on the input feature
      function style(feature) {
                    
        return {                    
        weight: 2,                    
        opacity: 1,                    
        color: 'purple',                    
        dashArray: '0',                    
        fillOpacity: 0.9,                    
        fillColor: getColor(feature.properties.emmisions)                
        };            
}

 // add geojson file to the map---commented out due to error and relaced down below          
 //geojson = L.geoJson.ajax("/contCO2emis2023.geojson", {style: style, onEachFeature: onEachFeature}).addTo(map);


// 4. create the legend
// note that line breaks have been added and may need to be removed
var labels = [];
for (var i = 0; i < grades.length - 1; i++) {
labels.push('<i style="background:' + colors[i] +
'"></i> ' + grades[i] + ' - ' + grades[i + 1]);
}
labels.push('<i style="background:' + colors[grades.length - 1] +
'"></i> ' + grades[grades.length - 1] + ' +');
$(".legend").html(labels.join('<br>'));

// 3.1 declare an empty GeoJSON object
//var geojson = null;
      // then we will continue to work on our event listeners
      var info = L.control();
      info.onAdd = function (map) {
          this._div = L.DomUtil.create('div', 'info'); // create a div with a class "info"
          this.update();
          return this._div;
      };

      // method that we will use to update the control based on feature properties passed
      info.update = function (props) {
            this._div.innerHTML = '<h4>Total CO2 Emissions 2023, (tons)</h4>' +  (props ?
            '<b>'+ props.CONTINENT + '</b><br />' + props.emmisions + '</b><br />' + 'tons of CO2'
            : 'Hover over a continent');
      };

      info.addTo(map);



      // 3.2.1 highlight a feature when the mouse hovers on it.

      function highlightFeature(e) {
      // e indicates the current event, we could call it anything
                  var layer = e.target;
                  //the target captures the object that the event associates with
                  layer.setStyle({
                  weight: 8,
                  opacity: 0.8,
                  color: '#e3e3e3',
                  fillColor: '#7e0af2',
                  fillOpacity: 0.5
                  });
                  // then bring the layer to the front.
                  layer.bringToFront();

                  // select the update class, and update the contet with the input value.
                  // remember whenver we call feature.properties, we're looking in the attributes
                  // for a particular layer - state name and state density, for example
                  info.update(layer.feature.properties);
                  }
                  // 3.2.3 reset the hightlighted feature when the mouse is out of its region.

  function resetHighlight(e) {
                  geojson.resetStyle(e.target);
                  info.update();  //this line will be called later
                  }


                  // 3.2.2 zoom to the highlighted feature when the mouse clicks it.

    function zoomToFeature(e) {
                  map.fitBounds(e.target.getBounds());
                  }

                  // now use on each feature option to add listeners on our state layers
                  // 3.3 add these events to the layer object.

    function onEachFeature(feature, layer) {
                  layer.on({
                  mouseover: highlightFeature,
                  click: zoomToFeature,
                  mouseout: resetHighlight
                  });
                  }
        
 // add geojson file to the map 
 //geojson = L.geoJson.ajax("/contCO2emis2023.geojson", {style: style, onEachFeature: onEachFeature}).addTo(map);
//L.geoJson.ajax("contCO2emis2023.geojson", { style: style, onEachFeature: onEachFeature }).addTo(map);
        geojson = L.geoJson.ajax("contCO2emis2023.geojson", {
  style: style,
  onEachFeature: onEachFeature
}).addTo(map);



        
map.attributionControl.addAttribution('Annual CO2 emission data &copy; <a href="https://ourworldindata.org/grapher/annual-co2-emissions-per-country">Our World in Data</a> | This map is made by Alexandra Brand');



      
</script>
</body>


</html>
